<div class="container">
  <h1>Lista de compras</h1>
  <form class="add-item-form" (ngSubmit)="adicionarItem()">
    <input type="text"
           name="item"
           id="item"
           [(ngModel)]="item"
           placeholder="Digite o nome do item"/>
    <button type="submit">Adicionar</button>
  </form>
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Item</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th>1</th>
        <th>Arroz</th>
        <th><input type="checkbox"/></th>
      </tr>
      <tr>
        <th>2</th>
        <th>Maça</th>
        <th><input type="checkbox"/></th>
      </tr>
    </tbody>
  </table>
</div>
